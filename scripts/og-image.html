<!doctype html>
<!--
  Source template for public/og-image.png (the social-share preview).
  Lives in scripts/ (not public/) so only the rendered PNG ships in the build.
  Edit this, then re-render with:
    npm run og   (or: node scripts/render-og.mjs)
  Renders this file to public/og-image.png at 1200x630 via headless Chrome.
  Colours mirror the tokens in src/style.css (see DESIGN.md).
-->
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700;800&family=Noto+Serif+SC:wght@700&display=block"
    />
    <style>
      :root {
        --jade-950: #072a22;
        --jade-900: #0a3a2f;
        --jade-800: #0f4f40;
        --jade-700: #1b6b57;
        --jade-200: #bfd9cd;
        --bone: #f1ece0;
        --bone-shade: #d8cfba;
        --ink: #1a1a1a;
        --tone-3: #1d4f9a;
        --tone-4: #1a1a1a;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }

      body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 96px 0 88px;
        font-family: 'Assistant', system-ui, sans-serif;
        background: var(--jade-800);
        color: var(--bone);
        direction: rtl;
        overflow: hidden;
      }

      /* ---------- Name ---------- */

      .text { display: flex; flex-direction: column; gap: 26px; max-width: 560px; }
      .title { font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
      .subtitle { font-size: 38px; font-weight: 600; color: var(--jade-200); line-height: 1.3; }

      .chips { display: flex; gap: 18px; margin-top: 18px; }
      .chip {
        padding: 10px 24px 12px;
        border-radius: 8px;
        background: var(--bone);
        color: var(--ink);
        font-size: 30px;
        font-weight: 700;
        box-shadow:
          inset 0 -3px 0 var(--bone-shade),
          0 5px 0 var(--jade-700),
          0 8px 0 var(--jade-950);
      }
      .chip.zh { font-family: 'Noto Serif SC', serif; direction: ltr; }
      .chip.latin { direction: ltr; }

      /* ---------- Two tiles: 汉 hàn (falling) and 语 yǔ (dipping) ---------- */

      .hand {
        display: flex;
        direction: ltr;
        gap: 26px;
        padding-bottom: 24px;
      }

      .tile {
        width: 216px;
        height: 310px;
        border-radius: 20px;
        background: var(--bone);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        box-shadow:
          inset 0 -6px 0 var(--bone-shade),
          0 14px 0 var(--jade-700),
          0 22px 0 var(--jade-950),
          0 40px 50px rgba(0, 0, 0, 0.35);
      }

      .tile:first-child { transform: rotate(-4deg) translateY(10px); }
      .tile:last-child { transform: rotate(3deg) translateY(-12px); }

      .glyph {
        font-family: 'Noto Serif SC', serif;
        font-weight: 700;
        font-size: 132px;
        line-height: 1;
        color: var(--ink);
      }

      .contour { width: 96px; height: 52px; overflow: visible; }
      .contour path { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }

      .py {
        font-size: 30px;
        font-weight: 600;
        color: #3d3a33;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="title">לימוד סינית</div>
      <div class="subtitle">אוצר מילים בסינית לדוברי עברית</div>
      <div class="chips">
        <span class="chip zh">汉字</span>
        <span class="chip latin">Pīnyīn</span>
        <span class="chip">עברית</span>
      </div>
    </div>

    <div class="hand" aria-hidden="true">
      <div class="tile">
        <div class="glyph">汉</div>
        <svg class="contour" viewBox="0 0 32 20"><path d="M3 4 L29 15" stroke="var(--tone-4)" /></svg>
        <div class="py">hàn</div>
      </div>
      <div class="tile">
        <div class="glyph">语</div>
        <svg class="contour" viewBox="0 0 32 20"><path d="M3 9 Q13 21 29 5" stroke="var(--tone-3)" /></svg>
        <div class="py">yǔ</div>
      </div>
    </div>
  </body>
</html>
