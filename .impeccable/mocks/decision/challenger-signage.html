<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שילוט טרמינל — סקיצה</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&family=Assistant:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffcc00;--y2:#e6b800;--k:#111;--k2:#2b2b2b;--w:#fff;--g:#18a957;--r:#e5322d;--floor:#e9e6df}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--floor);font-family:Assistant,sans-serif;color:var(--k)}
.hz{font-family:'Noto Sans SC',sans-serif;font-weight:900}
.band{background:var(--y);display:flex;align-items:stretch;box-shadow:0 14px 0 -6px var(--y2),0 26px 30px rgba(0,0,0,.18);position:relative;z-index:2}
.logo{background:var(--k);color:var(--y);display:flex;align-items:center;gap:14px;padding:0 40px;font-size:24px;font-weight:800}
.logo .hz{font-size:34px;color:var(--w)}
nav{display:flex}
nav a{display:flex;align-items:center;gap:10px;padding:26px 30px;font-size:21px;font-weight:700;cursor:pointer;border-inline-start:2px solid rgba(0,0,0,.12);transition:background .15s,color .15s}
nav a .ar{display:inline-block;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
nav a:hover{background:var(--k);color:var(--y)}
nav a:hover .ar{transform:translateX(-6px)}
nav a.on{background:var(--k);color:var(--w)}
.sq{width:30px;height:30px;background:var(--k);color:var(--w);display:grid;place-items:center;font-size:15px;border-radius:3px}
nav a:hover .sq,nav a.on .sq{background:var(--y);color:var(--k)}
.score{margin-inline-start:auto;display:flex;align-items:center;gap:14px;padding:0 40px;font-size:18px;font-weight:700}
.score b{font-size:40px;font-weight:800}
.tags{display:flex;gap:8px;padding:30px 64px 0}
.tag{position:relative;cursor:pointer}
.tag input{position:absolute;opacity:0}
.tag span{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--k);color:var(--w);font-weight:700;font-size:16px;border-radius:3px;transition:transform .15s,box-shadow .15s}
.tag:hover span{transform:translateY(-2px);box-shadow:0 5px 0 var(--k2)}
.tag input:checked+span{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 3px var(--k)}
.tag input:focus-visible+span{outline:3px solid var(--k);outline-offset:3px}
main{display:grid;grid-template-columns:520px 1fr;gap:56px;padding:34px 64px}
.q{background:var(--k);color:var(--w);border-radius:6px;padding:34px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 0 -8px #000,0 30px 40px rgba(0,0,0,.25)}
.q .lbl{color:var(--y);font-weight:700;font-size:18px}
.q .hz{font-size:230px;line-height:1;letter-spacing:-.02em;text-align:center;margin:10px 0}
.q .meta{display:flex;justify-content:space-between;color:#bbb;font-size:16px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts h2{font-size:26px;font-weight:800;margin-bottom:6px}
.o{position:relative;cursor:pointer}
.o input{position:absolute;opacity:0}
.o span{display:flex;align-items:center;gap:18px;background:var(--y);padding:20px 24px;font-size:28px;font-weight:800;border-radius:4px;
 box-shadow:0 8px 0 var(--y2),0 16px 22px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s,background .15s}
.o span .sq{width:44px;height:44px;font-size:22px}
.o span .ar{margin-inline-start:auto;font-size:30px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.o:hover span{transform:translateY(-3px);box-shadow:0 11px 0 var(--y2),0 22px 26px rgba(0,0,0,.16)}
.o:hover .ar{transform:translateX(-10px)}
.o:active span{transform:translateY(6px);box-shadow:0 2px 0 var(--y2)}
.o input:checked+span{background:var(--k);color:var(--w)}
.o.ok input:checked+span{background:var(--g);color:var(--w);box-shadow:0 8px 0 #0f7a3d}
.o.no input:checked+span{background:var(--r);color:var(--w);box-shadow:0 8px 0 #a31f1b}
.o.ok input:checked+span .ar::before{content:"✓ נכון "}
.o.no input:checked+span .ar::before{content:"✗ לא "}
.o input:focus-visible+span{outline:3px solid var(--k);outline-offset:4px}
</style>
</head>
<body>
<div class="band">
  <div class="logo"><span class="hz">汉语</span>לימוד סינית</div>
  <nav>
    <a><span class="sq">⌕</span>עיון וחיפוש <span class="ar">←</span></a>
    <a><span class="sq">⇄</span>כרטיסיות <span class="ar">←</span></a>
    <a class="on"><span class="sq">?</span>בוחן <span class="ar">←</span></a>
  </nav>
  <div class="score">ניקוד <b>7/9</b></div>
</div>
<div class="tags">
  <label class="tag"><input type="checkbox"><span>הכול 175</span></label>
  <label class="tag"><input type="checkbox" checked><span>זמני היום 9</span></label>
  <label class="tag"><input type="checkbox"><span>חלקי היום 6</span></label>
  <label class="tag"><input type="checkbox"><span>כינויי גוף 8</span></label>
  <label class="tag"><input type="checkbox"><span>ברכות 11</span></label>
  <label class="tag"><input type="checkbox"><span>כיוון ומיקום 14</span></label>
</div>
<main>
  <div class="q"><div class="lbl">שאלה 8 מתוך 9</div><div class="hz">晚安</div><div class="meta"><span>מה הפירוש?</span><span>זמני היום</span></div></div>
  <div class="opts">
    <h2>בחרו את התרגום</h2>
    <label class="o no"><input type="radio" name="a"><span><span class="sq">א</span>בוקר טוב<span class="ar">←</span></span></label>
    <label class="o ok"><input type="radio" name="a"><span><span class="sq">ב</span>לילה טוב<span class="ar">←</span></span></label>
    <label class="o no"><input type="radio" name="a"><span><span class="sq">ג</span>אחר־צוהריים<span class="ar">←</span></span></label>
    <label class="o no"><input type="radio" name="a"><span><span class="sq">ד</span>ערב<span class="ar">←</span></span></label>
  </div>
</main>
</body>
</html>
